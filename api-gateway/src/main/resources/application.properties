spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ─── Business Routes ──────────────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=startup-service
spring.cloud.gateway.routes[2].uri=lb://STARTUP-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/startups/**

spring.cloud.gateway.routes[3].id=investment-service
spring.cloud.gateway.routes[3].uri=lb://INVESTMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/investments/**

spring.cloud.gateway.routes[4].id=team-service
spring.cloud.gateway.routes[4].uri=lb://TEAM-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/teams/**

spring.cloud.gateway.routes[5].id=messaging-service
spring.cloud.gateway.routes[5].uri=lb://MESSAGING-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/messages/**

spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/payments/**

spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/notifications/**

# ─── Swagger API-Docs Routes ──────────────────────────────────────────────────
spring.cloud.gateway.routes[8].id=auth-service-docs
spring.cloud.gateway.routes[8].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/auth-docs,/auth-docs/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/auth-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[9].id=user-service-docs
spring.cloud.gateway.routes[9].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/user-docs,/user-docs/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/user-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[10].id=startup-service-docs
spring.cloud.gateway.routes[10].uri=lb://STARTUP-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/startup-docs,/startup-docs/**
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/startup-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[11].id=investment-service-docs
spring.cloud.gateway.routes[11].uri=lb://INVESTMENT-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/investment-docs,/investment-docs/**
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/investment-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[12].id=team-service-docs
spring.cloud.gateway.routes[12].uri=lb://TEAM-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/team-docs,/team-docs/**
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/team-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[13].id=messaging-service-docs
spring.cloud.gateway.routes[13].uri=lb://MESSAGING-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/messaging-docs,/messaging-docs/**
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/messaging-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[14].id=payment-service-docs
spring.cloud.gateway.routes[14].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/payment-docs,/payment-docs/**
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/payment-docs(/.*|$), /v3/api-docs$1

spring.cloud.gateway.routes[15].id=notification-service-docs
spring.cloud.gateway.routes[15].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[15].predicates[0]=Path=/notification-docs,/notification-docs/**
spring.cloud.gateway.routes[15].filters[0]=RewritePath=/notification-docs(/.*|$), /v3/api-docs$1

# ─── Centralized Swagger UI ───────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.urls[0].url=/auth-docs
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[1].url=/user-docs
springdoc.swagger-ui.urls[1].name=user-service
springdoc.swagger-ui.urls[2].url=/startup-docs
springdoc.swagger-ui.urls[2].name=startup-service
springdoc.swagger-ui.urls[3].url=/investment-docs
springdoc.swagger-ui.urls[3].name=investment-service
springdoc.swagger-ui.urls[4].url=/team-docs
springdoc.swagger-ui.urls[4].name=team-service
springdoc.swagger-ui.urls[5].url=/messaging-docs
springdoc.swagger-ui.urls[5].name=messaging-service
springdoc.swagger-ui.urls[6].url=/payment-docs
springdoc.swagger-ui.urls[6].name=payment-service
springdoc.swagger-ui.urls[7].url=/notification-docs
springdoc.swagger-ui.urls[7].name=notification-service

# ─── Zipkin ───────────────────────────────────────────────────────────────────
management.tracing.enabled=false
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
eureka.client.registry-fetch-interval-seconds=5

# Logging
logging.level.com.founderlink=DEBUG
logging.file.name=logs/api-gateway.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS — Gateway is the single source of CORS headers
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].exposedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# Strip duplicate CORS headers that downstream services may add
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_UNIQUE