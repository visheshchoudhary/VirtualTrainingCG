spring.application.name=startup-service
spring.cloud.config.enabled=false
# spring.config.import=optional:configserver:http://localhost:8888

server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/StartupService
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Logging
logging.level.com.founderlink=DEBUG
logging.file.name=logs/startup-service.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Cache Configuration
spring.cache.type=simple
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# Zipkin
management.tracing.sampling.probability=0.0
# management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.investmentService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.investmentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.investmentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.investmentService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.investmentService.permittedNumberOfCallsInHalfOpenState=3

# OpenFeign
spring.cloud.openfeign.circuitbreaker.enabled=true

# Disable Zipkin to fix Connection Refused
management.tracing.enabled=false



